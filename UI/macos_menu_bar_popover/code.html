<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Port Killer - Menu Bar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Space+Grotesk:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#313030",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "on-tertiary-fixed-variant": "#930007",
                        "secondary-fixed-dim": "#47e266",
                        "on-secondary-container": "#004615",
                        "surface-bright": "#393939",
                        "tertiary-fixed": "#ffdad5",
                        "on-background": "#e5e2e1",
                        "on-primary": "#003064",
                        "surface-container-high": "#2a2a2a",
                        "on-tertiary": "#690004",
                        "on-secondary": "#003910",
                        "on-tertiary-fixed": "#410001",
                        "primary-fixed-dim": "#aac7ff",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#ffb4aa",
                        "inverse-primary": "#005db8",
                        "on-surface-variant": "#c0c6d6",
                        "outline-variant": "#414754",
                        "primary-container": "#3e90ff",
                        "error": "#ffb4ab",
                        "secondary-container": "#09bf49",
                        "on-primary-fixed-variant": "#00468d",
                        "surface": "#131313",
                        "on-tertiary-container": "#5c0003",
                        "secondary": "#47e266",
                        "primary-fixed": "#d6e3ff",
                        "on-secondary-fixed": "#002106",
                        "secondary-fixed": "#6cff82",
                        "background": "#131313",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#00531a",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#001b3e",
                        "surface-container-highest": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "surface-dim": "#131313",
                        "on-primary-container": "#002957",
                        "surface-variant": "#353534",
                        "surface-container": "#201f1f",
                        "surface-tint": "#aac7ff",
                        "on-error": "#690005",
                        "primary": "#aac7ff",
                        "tertiary-container": "#ff5447",
                        "outline": "#8b91a0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Space Grotesk"],
                        "mono": ["JetBrains Mono"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
        body { font-family: 'Inter', sans-serif; }
        .label-text { font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.05em; }
        .mono-text { font-family: 'JetBrains Mono', monospace; }
        .glass-effect { backdrop-filter: blur(30px) saturate(180%); }
    </style>
</head>
<body class="bg-transparent flex items-start justify-center min-h-screen pt-4">
<!-- Compact Popover Frame -->
<div class="w-[320px] bg-surface/80 glass-effect rounded-xl overflow-hidden shadow-2xl ring-1 ring-on-surface/10 flex flex-col">
<!-- Top Navigation / Brand (Derived from Shared Components JSON TopNavBar) -->
<header class="flex justify-between items-center w-full px-4 h-12 bg-[#131313]/80 backdrop-blur-3xl">
<span class="text-lg font-bold tracking-tight text-[#E5E2E1]">Port Killer</span>
<div class="flex gap-2">
<button class="text-[#E5E2E1]/60 hover:bg-[#393939]/50 transition-all duration-200 p-1.5 rounded-lg flex items-center">
<span class="material-symbols-outlined text-[18px]">history</span>
</button>
<button class="text-[#E5E2E1]/60 hover:bg-[#393939]/50 transition-all duration-200 p-1.5 rounded-lg flex items-center">
<span class="material-symbols-outlined text-[18px]">filter_list</span>
</button>
<button class="text-[#E5E2E1]/60 hover:bg-[#393939]/50 transition-all duration-200 p-1.5 rounded-lg flex items-center">
<span class="material-symbols-outlined text-[18px]">refresh</span>
</button>
</div>
</header>
<!-- Search Bar Area -->
<div class="px-4 pb-3">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px]">search</span>
<input class="w-full bg-surface-container-lowest text-on-surface mono-text text-[13px] pl-10 pr-4 py-2 rounded-lg border-none focus:ring-1 focus:ring-primary/20 placeholder:text-on-surface-variant/40" placeholder="Search ports or PIDs..." type="text"/>
</div>
</div>
<!-- Port Heatmap Visualization (Specialized Component) -->
<div class="px-4 pb-4">
<div class="flex justify-between items-center mb-2">
<span class="label-text text-[10px] uppercase text-on-surface-variant">System Activity</span>
<span class="label-text text-[10px] uppercase text-secondary font-bold">Healthy</span>
</div>
<div class="flex gap-1">
<div class="h-1.5 flex-1 rounded-full bg-secondary"></div>
<div class="h-1.5 flex-1 rounded-full bg-secondary"></div>
<div class="h-1.5 flex-1 rounded-full bg-secondary"></div>
<div class="h-1.5 flex-1 rounded-full bg-tertiary-container/30"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<!-- List of Active Ports (High Density Editorial List) -->
<div class="flex flex-col flex-1 bg-surface-container-low/50">
<div class="px-4 py-2 flex justify-between border-b border-on-surface/5">
<span class="label-text text-[10px] uppercase text-on-surface-variant">Active Ports</span>
<span class="label-text text-[10px] uppercase text-on-surface-variant">PID</span>
</div>
<div class="overflow-y-auto max-h-[280px] py-1">
<!-- Port Row 1 -->
<div class="flex items-center justify-between px-4 py-3 group hover:bg-[#393939] transition-colors relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-secondary rounded-r-full"></div>
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="mono-text text-[14px] text-primary font-medium tracking-tight">3000</span>
<span class="text-[11px] text-on-surface-variant">node</span>
</div>
</div>
<div class="flex items-center gap-4">
<span class="mono-text text-[12px] text-on-surface-variant bg-surface-container-highest px-1.5 py-0.5 rounded">451</span>
<button class="w-8 h-8 flex items-center justify-center rounded-lg bg-error-container/20 text-error hover:bg-error-container hover:text-on-error-container transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Port Row 2 -->
<div class="flex items-center justify-between px-4 py-3 group hover:bg-[#393939] transition-colors relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-secondary rounded-r-full"></div>
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="mono-text text-[14px] text-primary font-medium tracking-tight">5432</span>
<span class="text-[11px] text-on-surface-variant">postgres</span>
</div>
</div>
<div class="flex items-center gap-4">
<span class="mono-text text-[12px] text-on-surface-variant bg-surface-container-highest px-1.5 py-0.5 rounded">882</span>
<button class="w-8 h-8 flex items-center justify-center rounded-lg bg-error-container/20 text-error hover:bg-error-container hover:text-on-error-container transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Port Row 3 -->
<div class="flex items-center justify-between px-4 py-3 group hover:bg-[#393939] transition-colors relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-secondary rounded-r-full"></div>
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="mono-text text-[14px] text-primary font-medium tracking-tight">8000</span>
<span class="text-[11px] text-on-surface-variant">python</span>
</div>
</div>
<div class="flex items-center gap-4">
<span class="mono-text text-[12px] text-on-surface-variant bg-surface-container-highest px-1.5 py-0.5 rounded">1240</span>
<button class="w-8 h-8 flex items-center justify-center rounded-lg bg-error-container/20 text-error hover:bg-error-container hover:text-on-error-container transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Port Row 4 -->
<div class="flex items-center justify-between px-4 py-3 group hover:bg-[#393939] transition-colors relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-secondary rounded-r-full"></div>
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="mono-text text-[14px] text-primary font-medium tracking-tight">8080</span>
<span class="text-[11px] text-on-surface-variant">java</span>
</div>
</div>
<div class="flex items-center gap-4">
<span class="mono-text text-[12px] text-on-surface-variant bg-surface-container-highest px-1.5 py-0.5 rounded">342</span>
<button class="w-8 h-8 flex items-center justify-center rounded-lg bg-error-container/20 text-error hover:bg-error-container hover:text-on-error-container transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Port Row 5 (Simulated high traffic warning) -->
<div class="flex items-center justify-between px-4 py-3 group hover:bg-[#393939] transition-colors relative bg-tertiary-fixed/5">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-tertiary-fixed-dim rounded-r-full"></div>
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="mono-text text-[14px] text-tertiary-fixed-dim font-medium tracking-tight">6379</span>
<span class="text-[11px] text-on-surface-variant">redis-server</span>
</div>
</div>
<div class="flex items-center gap-4">
<span class="mono-text text-[12px] text-on-surface-variant bg-surface-container-highest px-1.5 py-0.5 rounded">159</span>
<button class="w-8 h-8 flex items-center justify-center rounded-lg bg-error-container/20 text-error hover:bg-error-container hover:text-on-error-container transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
</div>
</div>
<!-- Footer Footer (Open Full App) -->
<footer class="p-4 bg-surface/40 flex flex-col gap-3">
<button class="w-full bg-primary text-on-primary-container font-bold text-[13px] py-2 rounded-lg flex items-center justify-center gap-2 hover:brightness-110 transition-all">
<span class="material-symbols-outlined text-[18px]">rocket_launch</span>
                Kill All High Usage
            </button>
<a class="label-text text-[11px] text-primary/80 hover:text-primary transition-colors text-center w-full flex items-center justify-center gap-1 group" href="#">
                Open Full App
                <span class="material-symbols-outlined text-[14px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</a>
</footer>
</div>
</body></html>
